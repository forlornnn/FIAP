<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Mouse</title>

    <style>
        #teste {
            width: 200px;
            height: 200px;
            background-color: red;
            padding: 20px 0 0 0 0;
            /* isso aqui centraliza o quadrado vermelho na pagina */
            margin: 20px auto;
            
            border-radius: 10px;
            text-decoration: none;
            user-select: none;
            /* so pra lembrar, isso aqui embaixo centraliza o texto dentro do quadrado vermelho */
            display: flex;
            text-align: center;
            align-items: center;
            justify-content: center;
            
            cursor: pointer;
            color: white;
            font-size: 25px;
            font-weight: 700;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>

</head>
<body>

    <div id="teste">

        Clique aqui!

    </div>

    <script>
        var teste = document.getElementById("teste");
        var cont = 0;

        // aqui que a mágica acontece, adicionando os eventos de click, mouseenter e mouseleave
        teste.addEventListener('click', clicou);
        teste.addEventListener('mouseenter', entrou);
        teste.addEventListener('mouseleave', saiu);

        
        function clicou() {
            teste.innerHTML = `Você clicou ${cont} vezes!`;
            cont++;
        }

        function entrou() {
            teste.innerHTML = `Clique aqui para aumentar a contagem!`;
        }

        function saiu() {
            teste.innerHTML = `Volte a clicar! Paramos em ${cont} cliques!`;
        }
    </script>
</body>

</html>
