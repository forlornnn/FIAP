<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ICONE DA PÁGINA -->
     <link rel="sortcut icon" href="./src/assets/icone.png">
     <!-- CSS EXTERNO -->
      <link rel="stylesheet" href="./src/css/estilo.css">
    <title>Loja Gamer</title>
</head>
<body>
    <header>
        <h1 class="logo">LOJA <span>GAMER</span></h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Jogos</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main id="container">
        <h2>Produtos em Destaques</h2>
        <section class="card">
            <div class="card-game">
                <img src="./src/assets/Jogo01.jpg" alt="Jogo-01"/>
                <article class="card-content">
                    <h2>Jogo 1</h2>
                    <p class="preco">R$ 400.00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>

              <div class="card-game">
                <img src="./src/assets/Jogo01.jpg" alt="Jogo-02"/>
                <article class="card-content">
                    <h2>Jogo 2</h2>
                    <p class="preco">R$ 300.00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>

              <div class="card-game">
                <img src="./src/assets/Jogo01.jpg" alt="Jogo-03"/>
                <article class="card-content">
                    <h2>Jogo 3</h2>
                    <p class="preco">R$ 200.00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>
        </section>

    </main>
    <footer>
        <p>&copy;-2026-Direitos Reservados</p>
    </footer>

</body>
</html>
